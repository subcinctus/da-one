<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Last Stance</title>
<meta name="description" content="Last Stance - a martial-arts revenge brawler for the browser, built for a controller: four stances, a custom combat deck, and a jade talisman that ages you every time you die.">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0f12;
    --ink: #f4efe6;
    --muted: #a7a196;
    --jade: #5fbf9a;
    --ember: #e2553f;
    --gold: #e8b85a;
    --panel: rgba(14, 15, 18, 0.82);
    --line: rgba(244, 239, 230, 0.16);
    --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --font-display: "Georgia", "Times New Roman", serif;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #ui * { box-sizing: border-box; }
  #fatal { display: none; position: fixed; left: 16px; right: 16px; top: 16px; padding: 12px 16px; background: #5a1111; color: #fff; border-radius: 6px; z-index: 100; font: 14px/1.4 var(--font); }
</style>
</head>
<body>
<div id="game"></div>
<div id="ui"></div>
<div id="fatal"></div>
<!--GAME_SCRIPT-->
</body>
</html>
