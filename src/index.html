<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Block City</title>
<meta name="description" content="Block City - a free-roam open-world sandbox in your browser: build and mine a voxel world, steal cars, outrun the cops.">
<style>
  :root {
    --bg: #0d1117;
    --fg: #f2f4f8;
    --muted: #9aa4b2;
    --accent: #f5c518;
    --danger: #e5484d;
    --ok: #46c46f;
    --panel: rgba(12, 15, 22, 0.86);
    --panel-border: rgba(255, 255, 255, 0.12);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: Impact, "Arial Black", "Helvetica Neue", system-ui, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0d1117; --fg: #f2f4f8; }
  }
  :root[data-theme="dark"] { --bg: #0d1117; --fg: #f2f4f8; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #ui * { box-sizing: border-box; }
  #fatal { display: none; position: fixed; left: 16px; right: 16px; top: 16px; padding: 12px 16px; background: #5a1111; color: #fff; border-radius: 8px; z-index: 100; font: 14px/1.4 var(--font); }
</style>
</head>
<body>
<div id="game"></div>
<div id="ui"></div>
<div id="fatal"></div>
<!--GAME_SCRIPT-->
</body>
</html>
