<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>iPhone Screen</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="app" data-live="connecting" data-operating="false" data-busy="false" data-orientation="portrait" data-visible="true">
    <header id="status">
      <span id="model">iPhone</span>
      <span id="live"><i class="dot" aria-hidden="true"></i><span id="live-text">Connecting…</span></span>
    </header>

    <section id="stage" aria-label="iPhone preview">
      <div id="device">
        <div class="side-button action-button" aria-hidden="true"></div>
        <div class="side-button volume-up" aria-hidden="true"></div>
        <div class="side-button volume-down" aria-hidden="true"></div>
        <div class="side-button power-button" aria-hidden="true"></div>
        <div class="receiver" aria-hidden="true"></div>
        <div id="screen">
          <img id="image" alt="Live iPhone screen" draggable="false" hidden>
          <div id="empty" data-state="connecting" role="status" aria-live="polite">
            <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <g data-icon="connecting"><path d="M19.2 9a7.5 7.5 0 0 0-12.7-2.4L4.25 8.75"/><path d="M4.25 4.5v4.25H8.5"/><path d="M4.8 15a7.5 7.5 0 0 0 12.7 2.4l2.25-2.15"/><path d="M19.75 19.5v-4.25H15.5"/></g>
              <g data-icon="offline"><path d="M8.5 3.25h7A2.25 2.25 0 0 1 17.75 5.5v7M6.25 9v9.5a2.25 2.25 0 0 0 2.25 2.25h7a2.25 2.25 0 0 0 2.25-2.25v-1"/><path d="M10.25 5.75h3.5M10.5 18.25h3M3.25 3.25l17.5 17.5"/></g>
              <g data-icon="locked"><rect x="5.5" y="10.25" width="13" height="10.5" rx="2.75"/><path d="M8 10.25v-3a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.25"/></g>
              <g data-icon="authentication"><path d="M12 2.75 20 6v5c0 4.5-3.5 7.8-8 10.25C7.5 18.8 4 15.5 4 11V6Z"/><rect x="8.5" y="10.75" width="7" height="5.5" rx="1.5"/><path d="M10 10.75V9a2 2 0 0 1 4 0v1.75"/></g>
              <g data-icon="paused"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 8.5v7M14.5 8.5v7"/></g>
              <g data-icon="unavailable"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.75"/><circle class="symbol-dot" cx="12" cy="16.5" r=".8"/></g>
            </svg>
            <span id="empty-text">Connecting to the iPhone…</span>
          </div>
          <div class="glow" aria-hidden="true"></div>
          <div class="island" aria-hidden="true"></div>
          <div id="cursors" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <nav id="toolbar" aria-label="iPhone controls">
      <button id="tool-refresh" type="button" aria-label="Refresh preview" title="Refresh preview">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18.5 8.25A7.5 7.5 0 1 0 19.5 12"/><path d="M18.5 4.25v4h-4"/></svg>
      </button>
      <button id="tool-home" type="button" aria-label="Go to Home Screen" title="Go to Home Screen">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4.5 10.75 6.3-5.3a1.85 1.85 0 0 1 2.4 0l6.3 5.3"/><path d="M6.5 9.15V18A1.5 1.5 0 0 0 8 19.5h8a1.5 1.5 0 0 0 1.5-1.5V9.15"/><path d="M10 19.5v-5.75h4v5.75"/></svg>
      </button>
      <button id="tool-screenshot" type="button" aria-label="Copy screenshot to clipboard" title="Copy screenshot to clipboard">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m8.5 6.5 1.2-1.75h4.6l1.2 1.75H18a1.75 1.75 0 0 1 1.75 1.75v9.5A1.75 1.75 0 0 1 18 19.5H6a1.75 1.75 0 0 1-1.75-1.75v-9.5A1.75 1.75 0 0 1 6 6.5Z"/><circle cx="12" cy="12.75" r="3.25"/></svg>
      </button>
    </nav>

    <p id="hint" hidden>The preview stopped. Ask Claude to open the iPhone screen again.</p>
  </main>
</body>
</html>
