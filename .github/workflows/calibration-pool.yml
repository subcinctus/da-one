name: calibration pool

# Build the calibration pool (human and AI texts from public datasets, plus the in-domain AI answers in
# tools/calib), score it with ZipPy (slow, so in four parallel shards), and store pool.jsonl and
# zippy.json on the `claude/ai-checker-calib` branch. The ONNX detectors are scored separately.
on:
  push:
    branches: [claude/ai-writing-checker]
    paths:
      - tools/calib/build_pool.py
      - tools/calib/zippy_pool.mjs
      - tools/calib/ai_answers_claude.jsonl
      - .github/workflows/calibration-pool.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install --quiet "datasets==4.1.1" "huggingface_hub==0.35.3" pandas pyarrow requests
      - name: Build pool
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/calib/build_pool.py pool.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: pool
          path: pool.jsonl

  zippy:
    needs: pool
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pool
      - run: node tools/calib/zippy_pool.mjs pool.jsonl zippy-${{ matrix.shard }}.json ${{ matrix.shard }} 4
      - uses: actions/upload-artifact@v4
        with:
          name: zippy-${{ matrix.shard }}
          path: zippy-${{ matrix.shard }}.json

  store:
    needs: zippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Merge and store on the calibration branch
        run: |
          set -e
          node tools/calib/zippy_pool.mjs --merge zippy.json art/zippy-*/zippy-*.json
          node tools/calib/tells_pool.mjs art/pool/pool.jsonl tells.json
          git clone -q --depth 1 --branch claude/ai-checker-calib \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" calib \
            || { mkdir calib && cd calib && git init -q -b claude/ai-checker-calib && \
                 git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" && cd ..; }
          cp art/pool/pool.jsonl calib/pool.jsonl
          cp zippy.json calib/zippy.json
          cp tells.json calib/tells.json
          cd calib
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pool.jsonl zippy.json tells.json
          git commit -q -m "Calibration pool, ZipPy and tell scores from ${GITHUB_SHA}" || { echo "unchanged"; exit 0; }
          git push -q origin claude/ai-checker-calib
          wc -l pool.jsonl
